<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#DCEEFF">
<title>English Quest</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --sky:#DCEEFF; --meadow:#E8F7E5;
  --card:#FFFFFF;
  --teal:#57C4A6; --teal-d:#3DA98C;
  --coral:#FF9C87; --sun:#FFD36B; --sun-d:#E8B23C; --lav:#B6A8EE; --blue:#7FC4F2; --pink:#FF9FC6;
  --ink:#44505F; --muted:#95A1B1; --line:#EDF0F5;
  font-family:'Nunito','Baloo 2','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:linear-gradient(180deg,var(--sky),var(--meadow));color:var(--ink);overflow:hidden;position:fixed;inset:0;user-select:none;}
#app{height:100%;max-width:520px;margin:0 auto;position:relative;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.on{display:flex;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{border:none;border-radius:16px;padding:14px 20px;font-size:18px;font-weight:900;color:#fff;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s;width:100%;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 var(--teal-d);}
.btn.sun{background:var(--sun);color:#8a6a12;box-shadow:0 5px 0 var(--sun-d);}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(120,140,170,.16);border:1px solid var(--line);}

/* START */
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px;}
.fox{width:120px;height:120px;}
.cover{width:100%;max-width:340px;border-radius:22px;box-shadow:0 10px 26px rgba(120,140,170,.22);}
.bounce{animation:bounce 1.8s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{font-size:34px;font-weight:900;color:#3f8f7d;}
.sub{color:var(--muted);font-weight:800;font-size:15px;}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 10px 26px rgba(120,140,170,.18);width:100%;max-width:360px;}
.name-in{width:100%;border:3px solid var(--line);border-radius:14px;padding:13px;font-size:19px;font-weight:800;text-align:center;color:var(--ink);outline:none;font-family:inherit;}
.name-in:focus{border-color:var(--teal);}

/* HUD */
.hud{display:flex;align-items:center;gap:7px;padding:12px 56px 6px 12px;}
.pill{background:#fff;border-radius:16px;padding:5px 10px;font-weight:900;font-size:13px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 8px rgba(120,140,170,.12);}
.pill.s{color:#F2A33C;} .pill.g{color:var(--teal-d);} .pill.h{color:#FF8A9B;}
.grow{flex:1;}

/* JUEGOS NUEVOS */
.g2{align-self:stretch;overflow-y:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:10px 16px 20px;width:100%;max-width:440px;margin:0 auto;}
.g2-sub{font-weight:900;color:var(--muted);font-size:15px;text-align:center;}
.sp-pic{font-size:84px;line-height:1;}
.sp-slots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;}
.sp-slots span{width:38px;height:46px;border-radius:10px;background:#fff;border-bottom:4px solid #C4CFDB;font-size:26px;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--ink);text-transform:lowercase;}
.sp-slots span.ok{border-color:var(--teal);color:var(--teal-d);animation:lspop .3s;}
.sp-es{font-weight:900;color:var(--teal-d);min-height:28px;font-size:23px;}
.sp-tiles{display:flex;flex-wrap:wrap;gap:9px;justify-content:center;max-width:360px;}
.sp-tile{width:52px;height:56px;border:none;border-radius:14px;background:var(--sun);box-shadow:0 5px 0 var(--sun-d);font-size:28px;font-weight:900;color:#5a4206;cursor:pointer;font-family:inherit;}
.sp-tile:active{transform:translateY(4px);box-shadow:0 1px 0 var(--sun-d);}
.sp-tile.used{opacity:.25;box-shadow:none;transform:translateY(4px);}
.sp-tile.no{animation:lsshake .35s;background:#FFB4A6;}
.bl-area{position:relative;align-self:stretch;height:100%;width:100%;overflow:hidden;background:linear-gradient(180deg,#BFE6FF,#EAF7FF);min-height:420px;}
.bl-top{position:absolute;top:8px;left:0;right:0;display:flex;align-items:center;justify-content:center;gap:10px;z-index:3;}
.bl-ask{background:#fff;border-radius:14px;padding:8px 14px;font-weight:900;font-size:22px;color:var(--ink);box-shadow:0 3px 0 rgba(120,140,170,.2);}
.bl{position:absolute;width:86px;height:100px;border:none;border-radius:50% 50% 48% 48%;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:inset -8px -10px 0 rgba(0,0,0,.08);font-family:inherit;}
.bl span{font-size:40px;font-weight:900;color:#2b2a4a;}
.bl span.bw{font-size:17px;word-break:break-word;padding:0 4px;text-align:center;line-height:1.05;} .bl i{position:absolute;bottom:-28px;left:50%;width:2px;height:28px;background:#8aa;}
.bl.pop{transform:scale(1.5);opacity:0;transition:all .25s;}
.bl.no{animation:lsshake .3s;}
.mo-face{font-size:96px;line-height:1;transition:transform .15s;}
.mo-face.chomp{animation:chomp .4s;}
@keyframes chomp{30%{transform:scale(1.25,.8)}60%{transform:scale(.9,1.15)}}
.mo-bub{background:#fff;border-radius:18px;padding:10px 16px;font-weight:900;font-size:19px;color:var(--ink);box-shadow:0 4px 0 rgba(120,140,170,.2);cursor:pointer;text-align:center;}
.mo-time{width:100%;height:10px;background:#E3E9F0;border-radius:6px;overflow:hidden;}
.mo-time i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#FF9C87,#FFD36B);}
.so-area{position:relative;align-self:stretch;height:100%;width:100%;overflow:hidden;min-height:440px;}
.so-item{position:absolute;left:50%;top:0;transform:translateX(-50%);background:#fff;border-radius:22px;padding:10px 18px;box-shadow:0 6px 0 rgba(120,140,170,.22);display:flex;flex-direction:column;align-items:center;transition:left .35s,opacity .35s;}
.so-item span{font-size:58px;line-height:1.1;} .so-item small{font-weight:900;font-size:27px;color:var(--ink);}
.so-item.goL{left:25%;opacity:0;} .so-item.goR{left:75%;opacity:0;} .so-item.bad{background:#FFE3DD;opacity:.4;}
.so-boxes{position:absolute;bottom:12px;left:10px;right:10px;display:flex;gap:12px;}
.so-box{flex:1;height:130px;border:none;border-radius:22px;background:var(--lav);box-shadow:0 7px 0 #8C7BD6;color:#fff;font-weight:900;font-size:16px;font-family:inherit;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;}
.so-box+.so-box{background:var(--coral);box-shadow:0 7px 0 #E06E58;}
.so-box b{font-size:44px;} .so-box:active{transform:translateY(5px);}
.tf-streak{font-size:24px;font-weight:900;color:#E06E58;min-height:32px;}
.tf-card{width:100%;max-width:300px;background:#fff;border-radius:26px;padding:22px;box-shadow:0 8px 0 rgba(120,140,170,.22);display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;}
.tf-card.in{animation:lspop .3s;} .tf-card.ok{background:#D9F6EC;} .tf-card.bad{background:#FFE3DD;animation:lsshake .35s;}
.tf-emo{font-size:96px;line-height:1.1;} .tf-word{font-size:30px;font-weight:900;color:var(--ink);text-align:center;}
.tf-btns{display:flex;gap:18px;margin-top:6px;}
.tf-b{width:110px;height:84px;border:none;border-radius:24px;font-size:40px;font-weight:900;color:#fff;cursor:pointer;font-family:inherit;}
.tf-b.si{background:var(--teal);box-shadow:0 7px 0 var(--teal-d);} .tf-b.no{background:#FF8A7A;box-shadow:0 7px 0 #E06E58;}
.tf-b:active{transform:translateY(5px);}
.sk-wrap{align-self:stretch;display:flex;flex-direction:column;width:100%;height:100%;}
.sk-sky{position:relative;flex:1;min-height:220px;background:linear-gradient(180deg,#1d2350,#3a3f8f 60%,#7FC4F2);overflow:hidden;border-radius:0 0 26px 26px;}
.sk-sky::before{content:'✦ · ✧ · ✦ · ✧';position:absolute;top:30%;left:8%;color:rgba(255,255,255,.5);letter-spacing:22px;font-size:14px;}
.sk-moon{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-size:54px;}
.sk-rocket{position:absolute;left:50%;bottom:8px;transform:translateX(-50%) rotate(-45deg);font-size:52px;transition:bottom .8s cubic-bezier(.3,1.4,.5,1);}
.sk-rocket.boost{animation:skboost .8s;} .sk-rocket.land{transform:translateX(-50%) rotate(0) scale(1.2);}
@keyframes skboost{30%{filter:drop-shadow(0 18px 10px #FFB43C)}}
.sk-panel{display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 16px 18px;}
.sk-emo{font-size:64px;line-height:1;} .sk-word{font-size:26px;font-weight:900;color:var(--ink);text-align:center;}
.sk-btns{display:flex;gap:14px;align-items:center;}
.sk-mic{width:92px;height:92px;border-radius:50%;border:5px solid #fff;background:var(--coral);box-shadow:0 7px 0 #E06E58;font-size:42px;cursor:pointer;}
.sk-mic.rec{background:#FF5A5A;animation:pulse 1s infinite;}
.sk-mic:active{transform:translateY(5px);box-shadow:0 2px 0 #E06E58;}
.sk-skip{border:none;background:#fff;border-radius:14px;padding:10px 12px;font-weight:900;color:var(--muted);box-shadow:0 3px 0 rgba(120,140,170,.2);font-family:inherit;visibility:hidden;}
.sk-st{font-weight:900;font-size:15px;min-height:40px;text-align:center;}
/* RACHA / TIENDA / ÁLBUM */
.pill.gem{border:none;color:#3DA98C;cursor:pointer;font-family:inherit;}
.dl{display:flex;align-items:center;gap:8px;padding:2px 14px 6px;font-weight:900;font-size:12px;cursor:pointer;flex-wrap:wrap;}
.dl-fire{background:#FFE7D6;color:#E06E58;border-radius:10px;padding:2px 8px;} .dl-fire.off{background:#EEF1F5;color:#A9B4C2;}
.dl-goal{color:var(--muted);} .dl-bar{display:flex;gap:3px;} .dl-bar i{width:14px;height:8px;border-radius:4px;background:#E3E9F0;display:block;} .dl-bar i.on{background:#FF9C87;}
.foxguide img{width:100%;height:100%;object-fit:contain;display:block;}
/* accesorios combinables: capa sobre el dibujo, posiciones en % de la imagen */
.pa{position:relative;height:100%;max-width:100%;margin:0 auto;container-type:inline-size;}
.pa>img{position:relative;z-index:1;width:100%;height:100%;object-fit:contain;display:block;}
.pa .acc svg{width:1em;height:1em;display:block;overflow:visible;} .pa .acc.back{z-index:0;} .pa .acc.svg.head svg{width:1.7em;height:1.7em;} .pa .acc.svg.head.big{transform:translate(-50%,-18%);z-index:3;} .pa .acc.svg.head.big svg{width:2.9em;height:2.9em;} .pa .acc.svg.eyes svg{width:1.05em;height:1.05em;} .pa .acc.svg.neck svg{width:1.8em;height:1.8em;} .pa .acc.svg.neck{transform:translate(-50%,-22%);}
.acc-ico{display:inline-block;width:1.15em;height:1.15em;vertical-align:middle;} .acc-ico svg{width:100%;height:100%;display:block;}
.pa .acc{position:absolute;line-height:1;pointer-events:none;transform:translate(-50%,-50%);z-index:2;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));}
.pa .acc.head{transform:translate(-50%,-66%);} .pa .acc.neck{transform:translate(-50%,-22%);} .pa .acc.hand{transform:translate(-50%,-50%) rotate(-12deg);}
.sh-tabs{display:flex;gap:8px;padding:0 14px 8px;}
.sh-tab{flex:1;border:none;border-radius:14px;padding:10px;font-weight:900;font-size:15px;background:#fff;color:var(--muted);font-family:inherit;box-shadow:0 3px 0 rgba(120,140,170,.18);cursor:pointer;}
.sh-tab.on{background:var(--teal);color:#fff;box-shadow:0 3px 0 var(--teal-d);}
.sh-body{flex:1;overflow-y:auto;padding:6px 14px 24px;width:100%;max-width:480px;margin:0 auto;}
.sh-fox{position:relative;width:150px;height:150px;margin:8px auto 4px;} .sh-fox img{width:100%;height:100%;object-fit:contain;}
.sh-mini{width:110px;height:110px;margin:0 auto 4px;}
.sh-slot{font-weight:900;font-size:15px;color:var(--ink);margin:14px 0 6px;} .sh-slot small{color:var(--muted);font-weight:800;font-size:12px;}
.sh-item.on{border-color:var(--teal);background:#E9FAF4;} .sh-item.sel{border-color:#FF9A3C;}
.sh-hint{text-align:center;font-weight:800;font-size:12px;color:var(--muted);margin-bottom:8px;}
.sh-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
.sh-item{border:3px solid transparent;background:#fff;border-radius:16px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer;font-family:inherit;box-shadow:0 4px 0 rgba(120,140,170,.18);}
.sh-item b{font-size:34px;line-height:1.15;} .sh-item small{font-weight:900;font-size:12px;color:var(--ink);} .sh-item span{font-weight:900;font-size:12px;color:#C98A1C;}
.sh-item.on{border-color:var(--teal);background:#E9FAF4;} .sh-item.sel{border-color:var(--sun);}
.sh-buy{margin-top:12px;background:#fff;border-radius:16px;padding:12px;text-align:center;font-weight:800;display:flex;flex-direction:column;gap:8px;box-shadow:0 4px 0 rgba(120,140,170,.18);}
.st-top{background:linear-gradient(160deg,#FFF4CF,#FFE7A3);border-radius:18px;padding:14px;text-align:center;font-weight:800;color:#8A6410;display:flex;flex-direction:column;gap:2px;box-shadow:0 4px 0 #EBC567;}
.st-top small{font-weight:700;color:#9C7A2C;} .st-big{font-size:40px;font-weight:900;color:#E09B12;line-height:1.1;}
.st-title{margin-top:6px;background:#fff;border-radius:12px;padding:4px 12px;align-self:center;font-weight:900;color:#C98A1C;}
.st-next{font-weight:800;font-size:13px;color:var(--ink);margin-bottom:8px;} .st-bar{height:12px;border-radius:8px;background:#EEF1F5;overflow:hidden;margin-top:4px;} .st-bar i{display:block;height:100%;background:linear-gradient(90deg,#FFD36B,#F2A33C);border-radius:8px;}
.st-goals{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;}
.st-goal{border:3px solid transparent;border-radius:14px;background:#F3F5F9;padding:6px 2px;display:flex;flex-direction:column;align-items:center;font-family:inherit;cursor:pointer;}
.st-goal b{font-size:26px;line-height:1.15;} .st-goal small{font-weight:900;font-size:10px;color:var(--ink);text-align:center;line-height:1.1;} .st-goal span{font-weight:900;font-size:10px;color:var(--muted);}
.st-goal.ok{background:#FFF6DA;border-color:#FFD36B;animation:stPulse 1.4s ease-in-out infinite;} @keyframes stPulse{50%{transform:scale(1.07)}} .st-goal.ok span{color:#C98A1C;} .st-goal.got{animation:none;background:#E9FAF4;border-color:var(--teal);} .st-goal.got span{color:var(--teal-d);}
.st-swap{display:flex;gap:10px;align-items:center;background:#fff;border-radius:16px;padding:10px 12px;font-weight:800;box-shadow:0 4px 0 rgba(120,140,170,.18);} .st-swap>div{flex:1;} .st-swap small{color:var(--muted);font-weight:700;} .st-swap .btn{width:auto;padding:10px 14px;} .st-swap .btn:disabled{filter:grayscale(1);opacity:.55;}
.sh-need{color:#E06E58;font-weight:900;}
.al-top{display:flex;flex-direction:column;gap:8px;align-items:center;font-weight:800;margin:4px 0 10px;text-align:center;}
.al-top .btn[disabled]{opacity:.45;}
.al-page{background:#fff;border-radius:18px;padding:10px;margin-bottom:12px;box-shadow:0 4px 0 rgba(120,140,170,.15);}
.al-h{font-weight:900;font-size:16px;margin-bottom:8px;color:var(--ink);} .al-h small{color:var(--muted);}
.al-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;}
.al-st{border:none;border-radius:12px;background:#FFF6DE;padding:6px 2px;display:flex;flex-direction:column;align-items:center;cursor:pointer;font-family:inherit;}
.al-st b{font-size:30px;line-height:1.15;} .al-st small{font-size:10px;font-weight:900;color:var(--ink);text-align:center;}
.al-st.empty{background:#EEF1F5;cursor:default;} .al-st.empty b{color:#C4CFDB;font-size:24px;padding:6px 0;}
.pk-ov{position:fixed;inset:0;background:rgba(30,35,60,.6);z-index:50;display:flex;align-items:center;justify-content:center;padding:16px;}
.pk-box{background:#fff;border-radius:24px;padding:18px;width:100%;max-width:380px;text-align:center;display:flex;flex-direction:column;gap:12px;}
.pk-row{display:flex;gap:8px;justify-content:center;}
.pk-card{flex:1;background:#FFF6DE;border-radius:16px;padding:10px 4px;display:flex;flex-direction:column;align-items:center;opacity:0;animation:pkin .5s forwards;}
.pk-card b{font-size:46px;} .pk-card span{font-weight:900;font-size:14px;} .pk-card small{font-size:10px;font-weight:800;color:var(--muted);}
@keyframes pkin{from{opacity:0;transform:rotateY(90deg) scale(.6)}to{opacity:1;transform:none}}
.pt-ask{display:flex;align-items:center;gap:10px;background:#fff;border-radius:18px;padding:8px 14px 8px 8px;box-shadow:0 4px 0 rgba(120,140,170,.2);font-weight:900;font-size:19px;color:var(--ink);}
.pt-ask .ls-spk.slow{width:52px;height:52px;font-size:24px;}
.pt-board{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;}
.pt-obj.wh{background:#DDE6F0;}
.pt-obj{aspect-ratio:1/1;border:none;border-radius:18px;background:#fff;box-shadow:0 5px 0 rgba(120,140,170,.2);padding:10px;cursor:pointer;color:#fff;}
.pt-obj svg{width:100%;height:100%;overflow:visible;} .pt-obj svg *{stroke:#2b2a4a;stroke-width:3;stroke-linejoin:round;}
.pt-obj .cp,.pt-obj .cp *{fill:currentColor;} .pt-obj.painted{animation:lspop .4s;}
.pt-obj.no{animation:lsshake .35s;}
.pt-board.nine .pt-obj{padding:7px;} .pt-pal{max-width:400px;} .pt-col i{width:34px!important;height:34px!important;}
.pt-pal{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.pt-col{border:3px solid transparent;background:#fff;border-radius:16px;padding:6px 8px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(120,140,170,.2);}
.pt-col i{width:40px;height:40px;border-radius:50%;display:block;border:3px solid rgba(0,0,0,.12);} .pt-col small{font-weight:900;font-size:12px;color:var(--ink);}
.pt-col.on{border-color:var(--ink);transform:translateY(-3px);}
/* PADRES */
.pg-ov{align-items:center;justify-content:center;} .pg-box{background:#fff;border-radius:26px;padding:22px 20px;width:min(340px,92vw);text-align:center;box-shadow:0 20px 50px rgba(30,50,60,.25);}
.pg-lock{font-size:38px;} .pg-box h3{font-size:22px;color:#2E3A45;margin:4px 0;} .pg-box p{color:#66737F;font-weight:700;font-size:16px;margin:0 0 10px;}
.pg-dots{display:flex;gap:14px;justify-content:center;margin:6px 0 16px;} .pg-dots i{width:18px;height:18px;border-radius:50%;border:3px solid #9DC8B6;} .pg-dots i.on{background:#5FA88B;border-color:#5FA88B;} .pg-dots.no{animation:lsshake .35s;}
.pa-pin{border:2px solid #CFE3DA;background:#fff;color:#3F7F67;border-radius:14px;padding:12px 16px;font-size:16px;font-weight:900;font-family:inherit;cursor:pointer;width:100%;}
.pg-q{font-size:34px;font-weight:900;color:#2E3A45;margin-bottom:14px;} .pg-q span{color:#5FA88B;} .pg-q.no{animation:lsshake .35s;}
.pg-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;} .pg-keys button{height:56px;border:none;border-radius:16px;background:#F1F5F4;font-size:24px;font-weight:900;color:#2E3A45;font-family:inherit;cursor:pointer;}
.pg-keys button.ok{background:#5FA88B;color:#fff;} .pg-x{margin-top:12px;border:none;background:none;color:#7A8794;font-weight:800;font-size:16px;font-family:inherit;cursor:pointer;}
#s-parents{background:#F3F6F4;} .pa2{display:flex;flex-direction:column;gap:14px;color:#2E3A45;}
.pa-hero{display:flex;align-items:center;justify-content:space-between;gap:10px;background:linear-gradient(140deg,#E3F1EA,#EAF1F8);border-radius:24px;padding:18px;box-shadow:0 2px 10px rgba(60,90,80,.08);}
.pa-hero-t small{font-size:14px;font-weight:800;color:#66737F;} .pa-hero-t h2{font-size:30px;margin:0 0 4px;color:#2E3A45;} .pa-hero-t span{display:block;font-size:16px;font-weight:800;color:#4A5763;margin-top:3px;}
.pa-kpis{display:grid;grid-template-columns:1fr 1fr;gap:12px;}

.pfx.m-twinkle i{animation-name:pfxTw;animation-timing-function:ease-in-out;} .pfx.m-drift i{animation-name:pfxDrift;opacity:.8;}
@keyframes pfxFall{0%{transform:translate(0,0) rotate(0)}50%{transform:translate(28px,50vh) rotate(160deg)}100%{transform:translate(-10px,100vh) rotate(320deg)}}
@keyframes pfxRise{0%{transform:translate(0,0);opacity:0}10%{opacity:1}50%{transform:translate(-18px,-45vh)}100%{transform:translate(12px,-90vh);opacity:0}}
@keyframes pfxTw{0%,100%{opacity:.1;transform:scale(.6)}50%{opacity:1;transform:scale(1.15)}}
@keyframes pfxDrift{0%{transform:translateX(-60vw)}100%{transform:translateX(110vw)}}
@media (prefers-reduced-motion:reduce){.pfx{display:none;}}
.path-scroll.dark .pdeco{filter:drop-shadow(0 0 6px rgba(255,255,255,.35));}
.pdeco{position:absolute;z-index:0;pointer-events:none;line-height:1;filter:drop-shadow(0 3px 2px rgba(60,90,60,.15));}
.pnode-wrap{position:absolute;z-index:2;width:80px;height:80px;margin-left:-40px;margin-top:-40px;display:flex;align-items:center;justify-content:center;}
.pnode{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;position:relative;
  --c:#57C4A6;--d:#3DA98C;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55) 0 18%,transparent 19%),var(--c);
  box-shadow:0 7px 0 var(--d),0 12px 14px rgba(40,70,60,.18);border:4px solid #fff;transition:transform .08s,box-shadow .08s;}
.pnode:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d),0 4px 6px rgba(40,70,60,.18);}
.pnode.k-lesson{--c:#7FC4F2;--d:#4E9FD4;}
.pnode.k-story{--c:#B6A8EE;--d:#8C7BD6;}
.pnode.k-chest{--c:#FFD36B;--d:#E0A82E;}
.pnode.k-game{--c:#FF9C87;--d:#E06E58;}
.pnode.k-dance{--c:#FF9FC6;--d:#E06E9E;}

.pnode.cur{width:84px;height:84px;font-size:38px;}
.pnode.cur::before{content:'';position:absolute;inset:-12px;border-radius:50%;border:5px solid rgba(255,211,107,.85);animation:ring 1.6s ease-in-out infinite;}
.pnode.lock{--c:#E3E9F0;--d:#C4CFDB;cursor:default;}
.pnode.lock .pico{filter:grayscale(1);opacity:.45;}
.plock{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.15);}
.pstar{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#FFD36B;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #E0A82E;border:2px solid #fff;}
@keyframes ring{0%,100%{transform:scale(.92);opacity:.9}50%{transform:scale(1.08);opacity:.35}}
.plabel{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#4a5666;background:#fff;padding:3px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 0 rgba(120,140,170,.18);}
.pnode.cur .plabel{background:#FFD36B;color:#7a5a08;box-shadow:0 3px 0 #E0A82E;}
.foxguide{position:absolute;width:66px;height:66px;top:6px;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2));animation:bob 1.8s ease-in-out infinite;}
.foxguide.r{left:calc(100% + 8px);} .foxguide.l{right:calc(100% + 8px);transform:scaleX(-1);}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-7px}}
.pbanner{position:absolute;left:50%;transform:translateX(-50%);z-index:1;background:#fff;border-radius:16px;padding:6px 16px;font-weight:900;font-size:13px;color:#3f8f7d;box-shadow:0 4px 0 rgba(120,140,170,.18);white-space:nowrap;}

/* LESSON */
.les{flex:1;display:flex;flex-direction:column;padding:14px;}
.lbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.lx{width:32px;height:32px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted);box-shadow:0 3px 8px rgba(120,140,170,.12);border:none;font-size:16px;}
.lpr{flex:1;height:14px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,140,170,.15);}
.lpr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#7FD9C2);transition:width .3s;}
.lhp{color:#FF8A9B;font-weight:900;font-size:14px;}
.qcard{flex:1;display:flex;flex-direction:column;}
.qt{text-align:center;color:var(--muted);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.qstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;}
.bigemoji{font-size:92px;line-height:1;animation:pop .3s ease;}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.qword{font-size:34px;font-weight:900;color:var(--teal-d);}
.qword.es{color:var(--coral);}
.qsub{font-size:15px;color:var(--muted);font-weight:800;}
.spk{background:var(--blue);border:none;color:#fff;border-radius:50%;width:86px;height:86px;font-size:38px;cursor:pointer;box-shadow:0 6px 0 #5aa7e0;}
.spk:active{transform:translateY(4px);box-shadow:0 2px 0 #5aa7e0;}
.spk.sm{width:50px;height:50px;font-size:22px;box-shadow:0 4px 0 #5aa7e0;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 8px;font-size:22px;font-weight:900;color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(120,140,170,.1);min-height:58px;display:flex;align-items:center;justify-content:center;}
.opt.emoji{font-size:38px;}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0);}
.opt.ok{border-color:var(--teal);color:var(--teal-d);background:#ECFAF6;}
.opt.no{border-color:var(--coral);color:var(--coral);background:#FFF1EE;}
.opt.dim{opacity:.4;}
.micbtn{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--pink));border:none;color:#fff;font-size:44px;cursor:pointer;box-shadow:0 7px 0 #e07f8f;}
.micbtn:active{transform:translateY(4px);box-shadow:0 3px 0 #e07f8f;}
.micbtn.rec{animation:pulse .9s ease-in-out infinite;}
/* build chips */
.tray{min-height:54px;width:100%;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:#fff;}
.chip{background:#EAF5FF;border:2px solid #cfe6f7;border-radius:12px;padding:8px 12px;font-weight:900;font-size:15px;color:var(--ink);cursor:pointer;}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}

/* feedback */
.fb{position:absolute;left:0;right:0;bottom:0;transform:translateY(120%);transition:transform .3s;z-index:6;}
.fb.on{transform:none;}
.fbin{border-radius:22px 22px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 20px rgba(0,0,0,.08);}
.fb.ok .fbin{background:#D9F6EC;}
.fb.no .fbin{background:#FFE6DF;}
.fbmsg{font-weight:900;font-size:19px;}
.fb.ok .fbmsg{color:var(--teal-d);} .fb.no .fbmsg{color:#e07a5f;}
.fbsub{font-size:15px;font-weight:800;color:var(--ink);}

/* REWARD */
.rew{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;position:relative;}
.chest{font-size:88px;animation:bounce 1.2s ease infinite;}
.rew h2{font-size:25px;font-weight:900;color:#E8A52E;}
.rew p{color:var(--muted);font-weight:800;}
.rewpill{background:#fff;border-radius:16px;padding:10px 16px;font-weight:900;box-shadow:0 4px 12px rgba(120,140,170,.15);}

/* STORY */
.story{flex:1;display:flex;flex-direction:column;}
.scene{flex:1;margin:12px;border-radius:18px;background:#EAF5FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;border:1px solid #d6e9fa;}
.ss{position:relative;width:100%;height:100%;overflow:hidden;container-type:size;border-radius:inherit;} .ss-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.ss.night .ss-bg{filter:brightness(.45) saturate(.8) hue-rotate(200deg);} .ss.night::after{content:'';position:absolute;inset:0;background:radial-gradient(circle at 80% 15%,rgba(255,240,180,.25),transparent 40%);pointer-events:none;}
.ss-c{position:absolute;transform:translateX(-50%);animation:ssIn .6s backwards, ssBob 2.4s ease-in-out .6s infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25));}
.ss-in{width:100%;height:100%;} .ss-in.flip{transform:scaleX(-1);} .ss-c .pa{height:100%;}
.ss-c.fly{animation:ssIn .6s backwards, ssFly 2.2s ease-in-out .6s infinite;} .ss-c.shiver{animation:ssIn .6s backwards, ssShiver .18s linear .6s infinite;}
@keyframes ssIn{from{opacity:0;transform:translateX(-50%) translateY(20%) scale(.8)}} @keyframes ssBob{50%{transform:translateX(-50%) translateY(-3%)}}
@keyframes ssFly{50%{transform:translateX(-50%) translateY(-9%) rotate(-3deg)}} @keyframes ssShiver{25%{transform:translateX(calc(-50% - 2px))}75%{transform:translateX(calc(-50% + 2px))}}
.ss-p{position:absolute;z-index:3;transform:translate(-50%,-50%);line-height:1;animation:ssPop .5s backwards;filter:drop-shadow(0 3px 3px rgba(0,0,0,.2));}
.ss-p.float{animation:ssPop .5s backwards, ssFloat 3s ease-in-out .5s infinite;} .ss-p.bounce{animation:ssPop .5s backwards, ssBounce 1s ease-in-out .5s infinite;}
.ss-p.spin{animation:ssPop .5s backwards, ssSpin 12s linear .5s infinite;} .ss-p.twinkle{animation:ssTw 1.6s ease-in-out infinite;} .ss-p.wave{animation:ssWave 2s ease-in-out infinite;}
.ss-p.walk{animation:ssWalk 3s ease-in-out infinite alternate;} .ss-p.dance{animation:ssDance .8s ease-in-out infinite;} .ss-p.fall{animation:ssFall 2.5s linear infinite;} .ss-p.pop{animation:ssPop .6s backwards;}
@keyframes ssPop{from{opacity:0;transform:translate(-50%,-50%) scale(.2)}} @keyframes ssFloat{50%{transform:translate(-50%,-62%)}} @keyframes ssBounce{50%{transform:translate(-50%,-70%)}}
@keyframes ssSpin{to{transform:translate(-50%,-50%) rotate(360deg)}} @keyframes ssTw{0%,100%{opacity:.35;transform:translate(-50%,-50%) scale(.8)}50%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}}
@keyframes ssWave{50%{transform:translate(-50%,-50%) rotate(8deg) translateY(-8%)}} @keyframes ssWalk{from{transform:translate(-50%,-50%) translateX(-30%)}to{transform:translate(-50%,-50%) translateX(40%)}}
@keyframes ssDance{0%,100%{transform:translate(-50%,-50%) rotate(-12deg)}50%{transform:translate(-50%,-65%) rotate(12deg)}} @keyframes ssFall{from{transform:translate(-50%,-150%);opacity:0}30%{opacity:1}to{transform:translate(-50%,200%);opacity:0}}
.ss-snow{position:absolute;top:-6%;color:#fff;font-style:normal;font-size:4cqh;animation:ssSnow 6s linear infinite;opacity:.85;} @keyframes ssSnow{to{transform:translateY(115cqh) translateX(4cqw)}}
.scene .emo{font-size:96px;text-align:center;line-height:1.15;letter-spacing:6px;}
.scene .ph{font-size:11px;font-weight:800;color:#9ec3e3;}
.stext{padding:0 16px 8px;}
.sen{font-size:20px;font-weight:900;line-height:1.4;}
.sen w{cursor:pointer;border-bottom:2px solid transparent;}
.sen w:active{border-bottom-color:var(--blue);color:var(--teal-d);}
.ses{color:#5B6478;font-weight:800;font-size:17px;line-height:1.35;margin-top:8px;padding-top:8px;border-top:2px dashed #E3E9F0;display:block;}
.ses.show{display:block;}
.srow{display:flex;gap:8px;padding:8px 14px 16px;}
.wtip{position:fixed;background:#2b3442;color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:12px;transform:transl(-50%,0);z-index:30;display:none;box-shadow:0 6px 16px rgba(0,0,0,.25);}

/* confetti */
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50;}
.mute{position:absolute;top:10px;right:10px;background:#fff;border:none;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;box-shadow:0 3px 8px rgba(120,140,170,.14);z-index:7;}
/* GAMES */
.gamehost{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.gamehost canvas{border-radius:16px;box-shadow:0 8px 24px rgba(60,70,110,.25);touch-action:none;}
.dancehost{flex:1;display:flex;flex-direction:column;}
.dance-wrap{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF4FB,#F0ECFF);}
.dance-bar{display:flex;align-items:center;gap:8px;padding:12px;}
.dance-prog{flex:1;height:14px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,140,170,.15);}
.dance-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .4s;}
.dance-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;}
.dance-fox{width:120px;height:120px;animation:dance .5s ease-in-out infinite alternate;}
@keyframes dance{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
.dance-emoji{font-size:84px;animation:pop .3s ease;}
.dance-en{font-size:40px;font-weight:900;color:var(--lav);}
.dance-es{font-size:18px;font-weight:800;color:var(--muted);}
.dance-next{max-width:220px;margin:0 auto 18px;}
/* MEMORY */
.ls-wrap{flex:1;display:flex;flex-direction:column;align-items:center;gap:14px;padding:10px 16px 20px;width:100%;max-width:440px;margin:0 auto;}
.ls-prog{display:flex;gap:6px;justify-content:center;}
.ls-prog i{width:12px;height:12px;border-radius:50%;background:#E3E9F0;display:block;}
.ls-prog i.ok{background:var(--teal);} .ls-prog i.now{background:var(--sun);transform:scale(1.25);}
.ls-ask{font-weight:900;color:var(--muted);font-size:15px;text-align:center;}
.ls-btns{display:flex;gap:12px;align-items:center;}
.ls-spk{width:96px;height:96px;border-radius:50%;border:4px solid #fff;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.5) 0 18%,transparent 19%),var(--blue);box-shadow:0 7px 0 #4E9FD4;font-size:44px;cursor:pointer;}
.ls-spk:active{transform:translateY(5px);box-shadow:0 2px 0 #4E9FD4;}
.ls-spk.slow{width:62px;height:62px;font-size:28px;background:var(--lav);box-shadow:0 5px 0 #8C7BD6;}
.ls-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%;}
.ls-card{aspect-ratio:1/1;border:none;border-radius:22px;background:#fff;font-size:64px;cursor:pointer;box-shadow:0 6px 0 rgba(120,140,170,.22);display:flex;align-items:center;justify-content:center;transition:transform .1s;font-family:inherit;}
.ls-grid.six{grid-template-columns:1fr 1fr 1fr;gap:10px;}
.ls-grid.six .ls-card{font-size:46px;border-radius:18px;}
.ls-card:active{transform:scale(.95);}
.ls-card.ok{background:#D9F6EC;box-shadow:0 6px 0 var(--teal);animation:lspop .4s;}
.ls-card.no{background:#FFE3DD;opacity:.55;animation:lsshake .35s;}
.ls-word{font-size:26px;font-weight:900;color:var(--teal-d);min-height:34px;}
@keyframes lspop{50%{transform:scale(1.12)}}
@keyframes lsshake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px;width:100%;max-width:420px;margin:auto;}
.mem-grid.big{grid-template-columns:repeat(4,1fr);gap:7px;padding:8px;}
.mem-grid.big .mem-card{min-height:62px;}
.mem-grid.big .mem-emo{font-size:28px;} .mem-grid.big .mem-word{font-size:15px;}
.mem-card{min-height:84px;aspect-ratio:3/4;border:none;border-radius:14px;background:linear-gradient(160deg,#7FC4F2,#5aa7e0);color:#fff;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.12);font-family:inherit;padding:4px;transition:transform .1s;}
.mem-card:active{transform:scale(.96);}
.mem-card.open{background:#fff;color:var(--ink);border:2px solid var(--blue);}
.mem-card.done{background:#D9F6EC;color:var(--teal-d);border:2px solid var(--teal);box-shadow:none;opacity:.85;}
.mem-emo{font-size:34px;} .mem-word{font-size:19px;word-break:break-word;text-align:center;line-height:1.1;} .mem-q{font-size:26px;opacity:.85;}
</style>

<div id="app">

/* escucha 'target' (texto en inglés); onOk() si lo dijo; onFail(oído) si no */
function micListen(id,target,onOk,onFail){
 if(!SR){micSet(id,'off','Este teléfono no escucha la voz acá. Decilo igual y tocá "Ya lo dije ✓".');onFail&&onFail(null,'nosr');return;}
 micStop(); try{speechSynthesis.cancel();}catch(e){}
 var rec; try{rec=new SR();}catch(e){micSet(id,'off','No pude abrir el micrófono. Tocá de nuevo.');return;}
 MIC_REC=rec; rec.lang='en-US';rec.interimResults=true;rec.maxAlternatives=5;rec.continuous=false;
 var done=false, heard='', opened=false, tgt=target.toLowerCase().replace(/[?.!,']/g,'');
 micSet(id,'wait','');
 function open(){ if(opened||done)return; opened=true; micSet(id,'listen','Decí: "'+target+'"'); tone(880,.08,'sine',.18,0);tone(1320,.12,'sine',.18,.09); }
 rec.onstart=function(){setTimeout(open,120);}; rec.onaudiostart=function(){setTimeout(open,120);};
 rec.onspeechstart=function(){ if(!done){open();micSet(id,'hear','');} };
 rec.onresult=function(e){ if(done)return; var all=[];
   for(var i=0;i<e.results.length;i++)for(var k=0;k<e.results[i].length;k++)all.push(e.results[i][k].transcript.toLowerCase());
   heard=e.results[e.results.length-1][0].transcript.toLowerCase().trim();
   if(all.some(function(a){a=a.replace(/[?.!,']/g,'');return a.indexOf(tgt)>=0||sim(a,tgt);})){done=true;micStop();micSet(id,'ok','Dijiste "'+target+'"');onOk&&onOk();return;}
   if(e.results[e.results.length-1].isFinal){done=true;micStop();micSet(id,'retry','Escuché "'+heard+'". Tocá 🎤 y decilo de nuevo');onFail&&onFail(heard);}
   else micSet(id,'hear','"'+heard+'"'); };
 rec.onerror=function(ev){ if(done)return; var er=ev&&ev.error; if(er==='aborted'){done=true;return;} done=true; micStop();
   if(er==='not-allowed'||er==='service-not-allowed'){var app=window.matchMedia&&matchMedia('(display-mode: standalone)').matches;
     micSet(id,'off',app?'Pedile a un adulto: Chrome → ⋮ → Configuración → Configuración de sitios → Micrófono → permitir. Mientras, tocá "Ya lo dije ✓".':'Tocá el 🔒 al lado de la dirección → Micrófono → Permitir. Mientras, tocá "Ya lo dije ✓".');
     try{navigator.mediaDevices.getUserMedia({audio:true}).then(function(s){s.getTracks().forEach(function(t){t.stop();});micSet(id,'idle','¡Listo! Ya podés tocar 🎤');}).catch(function(){});}catch(e){} onFail&&onFail(null,'blocked'); }
   else if(er==='no-speech'){micSet(id,'retry','No te escuché. Tocá 🎤 y hablá fuerte');onFail&&onFail('');}
   else if(er==='network'){micSet(id,'off','Necesito internet para escucharte');onFail&&onFail(null,'net');}
   else {micSet(id,'retry','Tocá 🎤 y probá otra vez');onFail&&onFail('');} };
 rec.onend=function(){ if(!done&&MIC_REC===rec){done=true;MIC_REC=null;document.body.classList.remove('mic-on');micSet(id,'retry',heard?'Escuché "'+heard+'". Tocá 🎤 de nuevo':'No te escuché. Tocá 🎤 y hablá fuerte');onFail&&onFail(heard);} };
 setTimeout(function(){ if(MIC_REC!==rec)return; try{rec.start();}catch(e){micSet(id,'retry','Tocá 🎤 de nuevo');} },60);
 setTimeout(function(){ if(!done&&MIC_REC===rec)open(); },1200);
}

 tw.forEach(function(x){ if(said.indexOf(x)>=0){hit++;return;} var tol=x.length<=3?1:Math.max(1,Math.floor(x.length*0.34)); if(sw.some(function(y){return y&&lev(y,x)<=tol;}))hit++; });
 return hit/tw.length>=0.6; }

function crossBuild(words,NW){
 for(var at=0;at<40;at++){
  var ws=shuffle(words.slice()).sort(function(a,b){return b.en.length-a.en.length;}).slice(0,NW+4), G={}, P=[];
  function get(r,c){return G[r+','+c];}
  function can(w,r,c,d){ var s=w.en.toLowerCase(), dr=d?1:0, dc=d?0:1, cross=0;
   if(get(r-dr,c-dc)||get(r+dr*s.length,c+dc*s.length))return -1;
   for(var i=0;i<s.length;i++){ var rr=r+dr*i, cc=c+dc*i, g=get(rr,cc);
    if(g){ if(g!==s[i])return -1; cross++; }
    else { if(get(rr+dc,cc+dr)||get(rr-dc,cc-dr))return -1; } }
   return cross; }
  function put(w,r,c,d){ var s=w.en.toLowerCase(); for(var i=0;i<s.length;i++)G[(r+(d?i:0))+','+(c+(d?0:i))]=s[i]; P.push({w:w,s:s,r:r,c:c,d:d}); }
  put(ws[0],0,0,0);
  for(var k=1;k<ws.length&&P.length<NW;k++){ var w=ws[k], s=w.en.toLowerCase(), opts=[];
   if(P.some(function(q){return q.s===s;}))continue;
   Object.keys(G).forEach(function(key){ var rc=key.split(',').map(Number), L=G[key];
    for(var j=0;j<s.length;j++){ if(s[j]!==L)continue; [0,1].forEach(function(d){ var r=rc[0]-(d?j:0), c=rc[1]-(d?0:j), x=can(w,r,c,d); if(x>0)opts.push([r,c,d]); }); } });
   if(opts.length){ var o=opts[(Math.random()*opts.length)|0]; put(w,o[0],o[1],o[2]); } }
  if(P.length<NW)continue;
  var r0=1e9,c0=1e9,r1=-1e9,c1=-1e9; Object.keys(G).forEach(function(k){var a=k.split(',').map(Number);r0=Math.min(r0,a[0]);r1=Math.max(r1,a[0]);c0=Math.min(c0,a[1]);c1=Math.max(c1,a[1]);});
  if(c1-c0+1>9||r1-r0+1>9)continue;
