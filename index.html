<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#DCEEFF">
<title>English Quest</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root{
  --sky:#DCEEFF; --meadow:#E8F7E5;
  --card:#FFFFFF;
  --teal:#57C4A6; --teal-d:#3DA98C;
  --coral:#FF9C87; --sun:#FFD36B; --sun-d:#E8B23C; --lav:#B6A8EE; --blue:#7FC4F2; --pink:#FF9FC6;
  --ink:#44505F; --muted:#95A1B1; --line:#EDF0F5;
  font-family:'Nunito','Baloo 2','Segoe UI',system-ui,-apple-system,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{height:100%;}
body{background:linear-gradient(180deg,var(--sky),var(--meadow));color:var(--ink);overflow:hidden;position:fixed;inset:0;user-select:none;}
#app{height:100%;max-width:520px;margin:0 auto;position:relative;}
.screen{position:absolute;inset:0;display:none;flex-direction:column;}
.screen.on{display:flex;animation:fade .3s ease;}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.btn{border:none;border-radius:16px;padding:14px 20px;font-size:18px;font-weight:900;color:#fff;font-family:inherit;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .08s,box-shadow .08s;width:100%;}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 rgba(0,0,0,.12);}
.btn.teal{background:var(--teal);box-shadow:0 5px 0 var(--teal-d);}
.btn.sun{background:var(--sun);color:#8a6a12;box-shadow:0 5px 0 var(--sun-d);}
.btn.ghost{background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(120,140,170,.16);border:1px solid var(--line);}

/* START */
.start{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:16px;padding:24px;}
.fox{width:120px;height:120px;}
.cover{width:100%;max-width:340px;border-radius:22px;box-shadow:0 10px 26px rgba(120,140,170,.22);}
.bounce{animation:bounce 1.8s ease-in-out infinite;}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.title{font-size:34px;font-weight:900;color:#3f8f7d;}
.sub{color:var(--muted);font-weight:800;font-size:15px;}
.card{background:var(--card);border-radius:24px;padding:20px;box-shadow:0 10px 26px rgba(120,140,170,.18);width:100%;max-width:360px;}
.name-in{width:100%;border:3px solid var(--line);border-radius:14px;padding:13px;font-size:19px;font-weight:800;text-align:center;color:var(--ink);outline:none;font-family:inherit;}
.name-in:focus{border-color:var(--teal);}

/* HUD */
.hud{display:flex;align-items:center;gap:7px;padding:12px 12px 6px;}
.pill{background:#fff;border-radius:16px;padding:5px 10px;font-weight:900;font-size:13px;display:flex;align-items:center;gap:5px;box-shadow:0 3px 8px rgba(120,140,170,.12);}
.pill.s{color:#F2A33C;} .pill.g{color:var(--teal-d);} .pill.h{color:#FF8A9B;}
.grow{flex:1;}

/* PATH */
.path-scroll{flex:1;overflow-y:auto;overflow-x:hidden;padding:0;-webkit-overflow-scrolling:touch;position:relative;
  background:
    radial-gradient(circle at 15% 8%,rgba(255,255,255,.55) 0 40px,transparent 41px),
    linear-gradient(180deg,#DCEEFF 0,#E3F5E3 260px,#D9F0D4 100%);}
#pathNodes{position:relative;margin:0 auto;width:100%;}
.proad{position:absolute;left:50%;top:0;margin-left:-160px;width:320px;pointer-events:none;z-index:0;overflow:visible;}
.pdeco{position:absolute;z-index:0;pointer-events:none;line-height:1;filter:drop-shadow(0 3px 2px rgba(60,90,60,.15));}
.pnode-wrap{position:absolute;z-index:2;width:80px;height:80px;margin-left:-40px;margin-top:-40px;display:flex;align-items:center;justify-content:center;}
.pnode{width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:32px;cursor:pointer;position:relative;
  --c:#57C4A6;--d:#3DA98C;background:radial-gradient(circle at 35% 28%,rgba(255,255,255,.55) 0 18%,transparent 19%),var(--c);
  box-shadow:0 7px 0 var(--d),0 12px 14px rgba(40,70,60,.18);border:4px solid #fff;transition:transform .08s,box-shadow .08s;}
.pnode:active{transform:translateY(5px);box-shadow:0 2px 0 var(--d),0 4px 6px rgba(40,70,60,.18);}
.pnode.k-lesson{--c:#7FC4F2;--d:#4E9FD4;}
.pnode.k-story{--c:#B6A8EE;--d:#8C7BD6;}
.pnode.k-chest{--c:#FFD36B;--d:#E0A82E;}
.pnode.k-game{--c:#FF9C87;--d:#E06E58;}
.pnode.k-dance{--c:#FF9FC6;--d:#E06E9E;}
.pnode.done{--c:#57C4A6;--d:#3DA98C;color:#fff;}
.pnode.cur{width:84px;height:84px;font-size:38px;}
.pnode.cur::before{content:'';position:absolute;inset:-12px;border-radius:50%;border:5px solid rgba(255,211,107,.85);animation:ring 1.6s ease-in-out infinite;}
.pnode.lock{--c:#E3E9F0;--d:#C4CFDB;cursor:default;}
.pnode.lock .pico{filter:grayscale(1);opacity:.45;}
.plock{position:absolute;right:-4px;bottom:-4px;width:26px;height:26px;border-radius:50%;background:#fff;font-size:13px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 5px rgba(0,0,0,.15);}
.pstar{position:absolute;right:-6px;top:-6px;width:26px;height:26px;border-radius:50%;background:#FFD36B;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 0 #E0A82E;border:2px solid #fff;}
@keyframes ring{0%,100%{transform:scale(.92);opacity:.9}50%{transform:scale(1.08);opacity:.35}}
.plabel{position:absolute;top:calc(100% + 10px);left:50%;transform:translateX(-50%);font-size:12px;font-weight:900;color:#4a5666;background:#fff;padding:3px 10px;border-radius:12px;white-space:nowrap;box-shadow:0 3px 0 rgba(120,140,170,.18);}
.pnode.cur .plabel{background:#FFD36B;color:#7a5a08;box-shadow:0 3px 0 #E0A82E;}
.foxguide{position:absolute;width:66px;height:66px;top:6px;pointer-events:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.2));animation:bob 1.8s ease-in-out infinite;}
.foxguide.r{left:calc(100% + 8px);} .foxguide.l{right:calc(100% + 8px);transform:scaleX(-1);}
@keyframes bob{0%,100%{margin-top:0}50%{margin-top:-7px}}
.pbanner{position:absolute;left:50%;transform:translateX(-50%);z-index:1;background:#fff;border-radius:16px;padding:6px 16px;font-weight:900;font-size:13px;color:#3f8f7d;box-shadow:0 4px 0 rgba(120,140,170,.18);white-space:nowrap;}

/* LESSON */
.les{flex:1;display:flex;flex-direction:column;padding:14px;}
.lbar{display:flex;align-items:center;gap:8px;margin-bottom:12px;}
.lx{width:32px;height:32px;border-radius:10px;background:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--muted);box-shadow:0 3px 8px rgba(120,140,170,.12);border:none;font-size:16px;}
.lpr{flex:1;height:14px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,140,170,.15);}
.lpr i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--teal),#7FD9C2);transition:width .3s;}
.lhp{color:#FF8A9B;font-weight:900;font-size:14px;}
.qcard{flex:1;display:flex;flex-direction:column;}
.qt{text-align:center;color:var(--muted);font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px;}
.qstage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;text-align:center;}
.bigemoji{font-size:92px;line-height:1;animation:pop .3s ease;}
@keyframes pop{0%{transform:scale(.7)}100%{transform:scale(1)}}
.qword{font-size:34px;font-weight:900;color:var(--teal-d);}
.qword.es{color:var(--coral);}
.qsub{font-size:15px;color:var(--muted);font-weight:800;}
.spk{background:var(--blue);border:none;color:#fff;border-radius:50%;width:86px;height:86px;font-size:38px;cursor:pointer;box-shadow:0 6px 0 #5aa7e0;}
.spk:active{transform:translateY(4px);box-shadow:0 2px 0 #5aa7e0;}
.spk.sm{width:50px;height:50px;font-size:22px;box-shadow:0 4px 0 #5aa7e0;}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px;}
.opt{background:#fff;border:2px solid var(--line);border-radius:16px;padding:15px 8px;font-size:18px;font-weight:900;color:var(--ink);cursor:pointer;font-family:inherit;box-shadow:0 3px 0 rgba(120,140,170,.1);min-height:58px;display:flex;align-items:center;justify-content:center;}
.opt.emoji{font-size:38px;}
.opt:active{transform:translateY(3px);box-shadow:0 0 0 rgba(0,0,0,0);}
.opt.ok{border-color:var(--teal);color:var(--teal-d);background:#ECFAF6;}
.opt.no{border-color:var(--coral);color:var(--coral);background:#FFF1EE;}
.opt.dim{opacity:.4;}
.micbtn{width:104px;height:104px;border-radius:50%;background:linear-gradient(135deg,var(--coral),var(--pink));border:none;color:#fff;font-size:44px;cursor:pointer;box-shadow:0 7px 0 #e07f8f;}
.micbtn:active{transform:translateY(4px);box-shadow:0 3px 0 #e07f8f;}
.micbtn.rec{animation:pulse .9s ease-in-out infinite;}
/* build chips */
.tray{min-height:54px;width:100%;border:2px dashed var(--line);border-radius:14px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;align-content:flex-start;background:#fff;}
.chip{background:#EAF5FF;border:2px solid #cfe6f7;border-radius:12px;padding:8px 12px;font-weight:900;font-size:15px;color:var(--ink);cursor:pointer;}
.bank{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:10px;}

/* feedback */
.fb{position:absolute;left:0;right:0;bottom:0;transform:translateY(120%);transition:transform .3s;z-index:6;}
.fb.on{transform:none;}
.fbin{border-radius:22px 22px 0 0;padding:16px;display:flex;flex-direction:column;gap:10px;box-shadow:0 -6px 20px rgba(0,0,0,.08);}
.fb.ok .fbin{background:#D9F6EC;}
.fb.no .fbin{background:#FFE6DF;}
.fbmsg{font-weight:900;font-size:19px;}
.fb.ok .fbmsg{color:var(--teal-d);} .fb.no .fbmsg{color:#e07a5f;}
.fbsub{font-size:15px;font-weight:800;color:var(--ink);}

/* REWARD */
.rew{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:24px;position:relative;}
.chest{font-size:88px;animation:bounce 1.2s ease infinite;}
.rew h2{font-size:25px;font-weight:900;color:#E8A52E;}
.rew p{color:var(--muted);font-weight:800;}
.rewpill{background:#fff;border-radius:16px;padding:10px 16px;font-weight:900;box-shadow:0 4px 12px rgba(120,140,170,.15);}

/* STORY */
.story{flex:1;display:flex;flex-direction:column;}
.scene{flex:1;margin:12px;border-radius:18px;background:#EAF5FF;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;overflow:hidden;border:1px solid #d6e9fa;}
.scene .emo{font-size:72px;}
.scene .ph{font-size:11px;font-weight:800;color:#9ec3e3;}
.stext{padding:0 16px 8px;}
.sen{font-size:20px;font-weight:900;line-height:1.4;}
.sen w{cursor:pointer;border-bottom:2px solid transparent;}
.sen w:active{border-bottom-color:var(--blue);color:var(--teal-d);}
.ses{color:var(--muted);font-weight:700;font-size:14px;margin-top:5px;display:none;}
.ses.show{display:block;}
.srow{display:flex;gap:8px;padding:8px 14px 16px;}
.wtip{position:fixed;background:#2b3442;color:#fff;font-weight:800;font-size:14px;padding:6px 12px;border-radius:12px;transform:transl(-50%,0);z-index:30;display:none;box-shadow:0 6px 16px rgba(0,0,0,.25);}

/* confetti */
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:50;}
.mute{position:absolute;top:10px;right:10px;background:#fff;border:none;width:38px;height:38px;border-radius:12px;font-size:17px;cursor:pointer;box-shadow:0 3px 8px rgba(120,140,170,.14);z-index:7;}
/* GAMES */
.gamehost{flex:1;position:relative;display:flex;align-items:center;justify-content:center;overflow:hidden;}
.gamehost canvas{border-radius:16px;box-shadow:0 8px 24px rgba(60,70,110,.25);touch-action:none;}
.dancehost{flex:1;display:flex;flex-direction:column;}
.dance-wrap{flex:1;display:flex;flex-direction:column;background:linear-gradient(180deg,#FFF4FB,#F0ECFF);}
.dance-bar{display:flex;align-items:center;gap:8px;padding:12px;}
.dance-prog{flex:1;height:14px;background:#fff;border-radius:8px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(120,140,170,.15);}
.dance-prog i{display:block;height:100%;background:linear-gradient(90deg,var(--pink),var(--lav));transition:width .4s;}
.dance-stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;text-align:center;}
.dance-fox{width:120px;height:120px;animation:dance .5s ease-in-out infinite alternate;}
@keyframes dance{from{transform:translateY(0) rotate(-6deg)}to{transform:translateY(-14px) rotate(6deg)}}
.dance-emoji{font-size:84px;animation:pop .3s ease;}
.dance-en{font-size:40px;font-weight:900;color:var(--lav);}
.dance-es{font-size:18px;font-weight:800;color:var(--muted);}
.dance-next{max-width:220px;margin:0 auto 18px;}
/* MEMORY */
.mem-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;padding:12px;width:100%;max-width:420px;margin:auto;}
.mem-card{min-height:84px;aspect-ratio:3/4;border:none;border-radius:14px;background:linear-gradient(160deg,#7FC4F2,#5aa7e0);color:#fff;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;box-shadow:0 4px 0 rgba(0,0,0,.12);font-family:inherit;padding:4px;transition:transform .1s;}
.mem-card:active{transform:scale(.96);}
.mem-card.open{background:#fff;color:var(--ink);border:2px solid var(--blue);}
.mem-card.done{background:#D9F6EC;color:var(--teal-d);border:2px solid var(--teal);box-shadow:none;opacity:.85;}
.mem-emo{font-size:34px;} .mem-word{font-size:15px;word-break:break-word;text-align:center;line-height:1.1;} .mem-q{font-size:26px;opacity:.85;}
</style>
</head>
<body>
<canvas id="cf"></canvas>
<div id="app">

  <!-- START -->
  <section class="screen on" id="s-start">
    <div class="start">
      <img class="cover bounce" src="img/cover.jpg" alt="English Quest">
      <div class="sub">¡Tu aventura para aprender inglés! 🌱</div>
      <div class="card">
        <p style="font-weight:800;color:var(--muted);margin-bottom:10px;">¿Cómo te llamás?</p>
        <input class="name-in" id="nameIn" placeholder="Tu nombre" maxlength="12" autocomplete="off">
        <div style="height:12px"></div>
        <button class="btn teal" onclick="startGame()">¡Empezar la aventura! 🚀</button>
      </div>
    </div>
  </section>

  <!-- PATH -->
  <section class="screen" id="s-path">
    <div class="hud">
      <div class="pill s">⭐ <span id="hStars">0</span></div>
      <div class="pill g">🌱 Nv.<span id="hLvl">1</span></div>
      <div class="grow"></div>
      <button class="pill" onclick="unlockAll()" style="cursor:pointer;border:none;background:#FFF3D6;color:#C98A1C;font-weight:900;" title="Probar todo">🔓 Probar</button>
      <div class="pill h">❤️ <span id="hHearts">5</span></div>
    </div>
    <div style="padding:0 14px 4px;color:var(--muted);font-weight:800;font-size:13px;" id="hHello">¡Hola!</div>
    <div class="path-scroll" id="pathScroll"><div id="pathNodes"></div></div>
  </section>

  <!-- LESSON -->
  <section class="screen" id="s-lesson">
    <div class="les">
      <div class="lbar"><button class="lx" onclick="quitLesson()">✕</button><div class="lpr"><i id="lpr"></i></div><div class="lhp">❤️<span id="lhp">5</span></div></div>
      <div class="qcard">
        <div class="qt" id="qt"></div>
        <div class="qstage" id="qstage"></div>
        <div class="opts" id="qopts"></div>
      </div>
    </div>
    <div class="fb" id="fb"><div class="fbin"><div class="fbmsg" id="fbmsg"></div><div class="fbsub" id="fbsub"></div><button class="btn teal" id="fbbtn" onclick="nextQ()">Seguir →</button></div></div>
  </section>

  <!-- REWARD -->
  <section class="screen" id="s-reward">
    <div class="rew" id="rewBody"></div>
  </section>

  <!-- STORY -->
  <section class="screen" id="s-story">
    <div class="hud"><div class="pill" id="stTitle">📖</div><div class="grow"></div><div class="pill g" id="stPage">1/1</div></div>
    <div class="story">
      <div class="scene" id="stScene"></div>
      <div class="stext"><div class="sen" id="stEn"></div><div class="ses" id="stEs"></div></div>
      <div class="srow">
        <button class="btn ghost" style="flex:0 0 auto;width:auto" onclick="narrate()">🔊</button>
        <button class="btn ghost" style="flex:0 0 auto;width:auto" onclick="toggleEs()">ES</button>
        <button class="btn teal" id="stNext" onclick="storyNext()">Siguiente →</button>
      </div>
    </div>
  </section>

  <!-- GAME -->
  <section class="screen" id="s-game">
    <div class="hud"><button class="lx" onclick="exitGame()">✕</button><div class="pill" id="gTitle">🎮</div><div class="grow"></div><div class="pill s" id="gScore">0</div></div>
    <div id="gameHost" class="gamehost"></div>
  </section>

  <!-- DANCE -->
  <section class="screen" id="s-dance">
    <div id="danceHost" class="dancehost"></div>
  </section>

  <button class="mute" id="muteB" onclick="toggleMute()">🔊</button>
  <div class="wtip" id="wtip"></div>
</div>

<script>
/* ===== FOX ===== */
function foxSVG(mood){
  var mouth = mood==='sad' ? '<path d="M26 42 q4 -3 8 0" stroke="#45505F" stroke-width="2" fill="none" stroke-linecap="round"/>'
                           : '<path d="M26 41 q4 4 8 0" stroke="#45505F" stroke-width="2" fill="none" stroke-linecap="round"/>';
  return '<svg viewBox="0 0 60 64"><ellipse cx="30" cy="58" rx="16" ry="3.5" fill="rgba(0,0,0,.08)"/>'
    +'<polygon points="12,22 8,5 25,17" fill="#FF9C6B"/><polygon points="48,22 52,5 35,17" fill="#FF9C6B"/>'
    +'<polygon points="14,21 11,10 23,18" fill="#FFD9C2"/><polygon points="46,21 49,10 37,18" fill="#FFD9C2"/>'
    +'<circle cx="30" cy="34" r="20" fill="#FFB27A"/><path d="M11 36 a19 19 0 0 0 38 0 z" fill="#FFF0E2"/>'
    +'<circle cx="22" cy="31" r="2.8" fill="#45505F"/><circle cx="38" cy="31" r="2.8" fill="#45505F"/>'
    +'<circle cx="23" cy="30" r=".9" fill="#fff"/><circle cx="39" cy="30" r=".9" fill="#fff"/>'
    +'<ellipse cx="30" cy="38" rx="3" ry="2.4" fill="#45505F"/>'+mouth
    +'<circle cx="16" cy="38" r="3.4" fill="#FF9FC6" opacity=".55"/><circle cx="44" cy="38" r="3.4" fill="#FF9FC6" opacity=".55"/></svg>';
}
function setFox(id,m){var e=document.getElementById(id);if(e)e.innerHTML=foxSVG(m||'happy');}
setFox('foxStart','happy');

/* ===== SOUND ===== */
var muted=false,actx=null;
function AC(){if(!actx){try{actx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}if(actx&&actx.state==='suspended'){try{actx.resume();}catch(e){}}return actx;}
function tone(f,d,t,v,w){if(muted)return;var c=AC();if(!c)return;var tt=c.currentTime+(w||0);var o=c.createOscillator(),g=c.createGain();o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);g.gain.setValueAtTime(.0001,tt);g.gain.exponentialRampToValueAtTime(v||.2,tt+.02);g.gain.exponentialRampToValueAtTime(.0001,tt+d);o.start(tt);o.stop(tt+d+.02);}
function sGood(){tone(523,.12,'triangle',.22,0);tone(659,.12,'triangle',.22,.1);tone(784,.2,'triangle',.22,.2);}
function sBad(){tone(240,.16,'sine',.16,0);tone(180,.2,'sine',.16,.1);}
function sTap(){tone(520,.05,'sine',.12,0);}
function sWin(){[523,659,784,1047].forEach(function(f,i){tone(f,.24,'triangle',.22,i*.13);});}
function toggleMute(){muted=!muted;document.getElementById('muteB').textContent=muted?'🔇':'🔊';if(!muted){sTap();}}

/* ===== VOICE ===== */
var enVoice=null, speechReady=false;
function pickVoice(){try{var vs=speechSynthesis.getVoices();enVoice=vs.find(function(v){return /en[-_]US/i.test(v.lang);})||vs.find(function(v){return /^en/i.test(v.lang);})||null;}catch(e){}}
if('speechSynthesis' in window){pickVoice();speechSynthesis.onvoiceschanged=pickVoice;}
function unlockSpeech(){ if(speechReady)return; speechReady=true; try{AC();var u=new SpeechSynthesisUtterance(' ');u.volume=0;speechSynthesis.speak(u);}catch(e){} }
function say(t,rate){if(muted)return;try{speechSynthesis.cancel();speechSynthesis.resume();var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=rate||0.85;u.pitch=1.05;if(enVoice)u.voice=enVoice;speechSynthesis.speak(u);}catch(e){}}

var L=null, answered=false;
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function others(unit,en,n){return shuffle(unit.w.filter(function(w){return w.en!==en;})).slice(0,n);}
function buildQ(ui){
 var u=UNITS[ui],ws=shuffle(u.w),out=[];
 var types=u.isP?['translate','listen','build','say']:['pic','listen','translate','say'];
 ws.forEach(function(w,idx){out.push({w:w,u:u,type:types[idx%types.length]});});
 return out;
}
function startLesson(ui){sTap();unlockSpeech();L={ui:ui,qs:buildQ(ui),i:0,ok:0,hearts:5};show('s-lesson');renderQ();}
function renderQ(){
 answered=false;

 document.getElementById('lpr').style.width=(L.i/L.qs.length*100)+'%';
 document.getElementById('lhp').textContent=L.hearts;
 var st=document.getElementById('qstage'),op=document.getElementById('qopts'),qt=document.getElementById('qt');
 st.innerHTML='';op.innerHTML='';
 if(q.type==='pic'){
   qt.textContent='¿Qué es esto?';
   st.innerHTML='<div class="bigemoji">'+w.e+'</div><div class="qsub">en inglés es…</div>';
   shuffle([w].concat(others(u,w.en,3))).forEach(function(x){op.appendChild(mk(x.en,x.en===w.en,false));});
 } else if(q.type==='listen'){
   qt.textContent='Escuchá y elegí 👂';
   st.innerHTML='<button class="spk" onclick="say(\''+w.en.replace(/\x27/g,'')+'\')">🔊</button><div class="qsub">Tocá para escuchar</div>';
   setTimeout(function(){say(w.en);},300);
   if(u.isP){ shuffle([w].concat(others(u,w.en,3))).forEach(function(x){op.appendChild(mk(x.es,x.en===w.en,false));}); }
   else { shuffle([w].concat(others(u,w.en,3))).forEach(function(x){op.appendChild(mk(x.e,x.en===w.en,true));}); }
 } else if(q.type==='translate'){
   qt.textContent='¿Cómo se dice?';
   st.innerHTML='<div class="qword es">'+w.es+'</div><div class="qsub">en inglés</div>';
   shuffle([w].concat(others(u,w.en,3))).forEach(function(x){op.appendChild(mk(x.en,x.en===w.en,false));});
 } else if(q.type==='build'){
   qt.textContent='Armá la frase 🧩';
   st.innerHTML='<div class="qsub" style="font-size:13px">'+w.es+'</div><div class="tray" id="tray"></div><div class="qsub" style="margin-top:6px">Tocá las palabras en orden</div>';
   var bank=document.createElement('div');bank.className='bank';
   var words=shuffle(w.en.split(' '));
   words.forEach(function(wd){var c=document.createElement('div');c.className='chip';c.textContent=wd;c.onclick=function(){moveChip(c,wd);};bank.appendChild(c);});
   op.appendChild(bank);
   var chk=document.createElement('button');chk.className='btn teal';chk.style.gridColumn='1 / span 2';chk.textContent='Revisar ✓';chk.onclick=function(){checkBuild(w);};op.appendChild(chk);
 } else { // say (mic)
   qt.textContent='Escuchá y repetí 🎤';
   st.innerHTML='<div class="bigemoji" style="font-size:56px">'+w.e+'</div><div class="qword">'+w.en+'</div><div class="qsub">'+w.es+'</div><button class="spk sm" onclick="say(\''+w.en.replace(/\x27/g,'')+'\')">🔊</button><div class="qsub" id="micStatus" style="margin-top:8px;min-height:22px;font-weight:800"></div>';
   setTimeout(function(){say(w.en);},300);
   var mb=document.createElement('button');mb.className='micbtn';mb.id='micB';mb.style.gridColumn='1 / span 2';mb.style.margin='0 auto';mb.textContent='🎤';mb.onclick=function(){doMic(w,mb);};op.appendChild(mb);

function mk(label,right,isEmoji){var b=document.createElement('button');b.className='opt'+(isEmoji?' emoji':'');b.textContent=label;b.onclick=function(){pick(b,right,label);};return b;}
var tray=[];
function moveChip(c,wd){ if(c.dataset.used)return; c.dataset.used='1';c.style.opacity='.3'; var t=document.getElementById('tray'); var s=document.createElement('span');s.className='chip';s.textContent=wd;s.onclick=function(){s.remove();c.dataset.used='';c.style.opacity='1';};t.appendChild(s); sTap(); }
function checkBuild(w){ var t=document.getElementById('tray'); var got=Array.prototype.map.call(t.children,function(x){return x.textContent;}).join(' '); if(got.trim().toLowerCase()===w.en.toLowerCase())good(w); else wrong(w); }
function pick(b,right,label){ if(answered)return; if(right){good(L.qs[L.i].w,b);} else { answered=true;b.classList.add('no');sBad();L.hearts--;document.getElementById('lhp').textContent=L.hearts;Array.prototype.forEach.call(document.querySelectorAll('.opt'),function(o){if(o!==b)o.classList.add('dim');}); setFox('foxStart','sad'); fb(false,L.qs[L.i].w); if(L.hearts<=0)document.getElementById('fbbtn').textContent='↻ Reintentar'; } }
function micSt(t,col){var s=document.getElementById('micStatus');if(s){s.textContent=t;s.style.color=col||'var(--teal-d)';}}
function doMic(w,btn){
 if(!SR){ micSt('Este navegador no escucha la voz. Usá Chrome, o tocá "Ya lo dije".','#e07a5f'); return; }
 var r;
 try{ r=new SR(); }catch(e){ micSt('No pude abrir el micrófono. Probá de nuevo 🎤','#e07a5f'); return; }
 r.lang='en-US'; r.interimResults=true; r.maxAlternatives=4; r.continuous=false;
 var done=false, heard='';
 btn.classList.add('rec'); micSt('Escuchando… 🎤 decí "'+w.en+'"');
 r.onresult=function(e){
   var said='';
   for(var i=0;i<e.results.length;i++){ said+=' '+e.results[i][0].transcript; }
   heard=said.toLowerCase().trim();
   var last=e.results[e.results.length-1];
   if(last && last.isFinal){
     done=true; btn.classList.remove('rec');
     var tgt=w.en.toLowerCase().replace(/[?.!,]/g,'');
     var ok=false; for(var k=0;k<last.length;k++){var alt=last[k].transcript.toLowerCase();if(alt.indexOf(tgt)>=0||sim(alt,tgt)){ok=true;break;}}
     if(!ok) ok = heard.indexOf(tgt)>=0 || sim(heard,tgt);
     if(ok){ micSt('¡Muy bien! 👏'); good(w); }
     else { micSt('Escuché: "'+heard+'". Probá otra vez 🎤','#E8A52E'); }
   } else { micSt('Te escucho… 🎤'); }
 };
 r.onerror=function(ev){ btn.classList.remove('rec'); var err=ev&&ev.error;
   if(err==='not-allowed'||err==='service-not-allowed'){ micSt('Tenés que permitir el micrófono: tocá el 🔒 (o ⓘ) arriba, Permisos → Micrófono → Permitir.','#e07a5f'); }
   else if(err==='no-speech'){ micSt('No te escuché. Tocá 🎤 y hablá fuerte y claro.','#E8A52E'); }
   else if(err==='audio-capture'){ micSt('No encuentro el micrófono del teléfono.','#e07a5f'); }
   else if(err==='network'){ micSt('Necesito internet para escucharte.','#e07a5f'); }
   else if(err==='aborted'){ /* ignore */ }
   else { micSt('Tocá 🎤 y probá otra vez.','#E8A52E'); }
 };
 r.onend=function(){ btn.classList.remove('rec'); };
 try{ r.start(); }catch(e){ btn.classList.remove('rec'); micSt('Tocá 🎤 de nuevo.','#E8A52E'); }

 function solidAtWx(wx){var idx=Math.floor(wx/tileW);return (idx<0||idx>=N)?true:solid[idx];}
 function loseLife(){ lives--; hud(); sBad(); if(lives<=0){GAME.stop();gameLose('island',function(){startIsland(unitIdx);});return;} var idx=Math.floor(foxWx()/tileW); while(idx<N && !solid[idx]) idx++; worldX=idx*tileW-foxX; foxY=groundY-foxH-50; foxVy=0; inv=90; onGround=false; }
 GAME.on=true;
 var scroll=2.5;
 function loop(){ if(!GAME.on)return;
   worldX+=scroll; foxVy+=0.62; foxY+=foxVy; if(inv>0)inv--;
   var fwx=foxWx(), footY=foxY+foxH, landed=false;
   plats.forEach(function(p){ if(fwx>p.wx-6&&fwx<p.wx+p.w+6){ if(foxVy>=0&&footY>=p.y&&footY<=p.y+28){foxY=p.y-foxH;foxVy=0;onGround=true;landed=true;} } });
   if(!landed && solidAtWx(fwx)){ if(foxVy>=0&&footY>=groundY){foxY=groundY-foxH;foxVy=0;onGround=true;landed=true;} }
   if(!landed) onGround=false;
   if(foxY>H+70){ loseLife(); if(!GAME.on)return; }
   if(inv<=0){ for(var ci=0;ci<crabs.length;ci++){ var cr=crabs[ci]; if(!cr.alive)continue; if(Math.abs(cr.wx-fwx)<32 && foxY+foxH>groundY-14){ loseLife(); if(!GAME.on)return; break; } } }
   apples.forEach(function(ap){ if(ap.taken)return; if(Math.abs(ap.wx-fwx)<40 && Math.abs((ap.y+20)-(foxY+foxH/2))<64){ ap.taken=true; score++; hud(); say(ap.word.en); sGood(); burst(6); msg=ap.word.en+' = '+ap.word.es; msgT=75; } });
   if(fwx>=flagWx){ finishGameNode('🏝️ ¡Ganaste English Island!','Llegaste a la meta 🏁 y juntaste '+score+' palabras'); return; }
   // DRAW
   var sky=c.createLinearGradient(0,0,0,H); sky.addColorStop(0,'#8FD6FF'); sky.addColorStop(1,'#D6F2FF'); c.fillStyle=sky; c.fillRect(0,0,W,H);
   clouds.forEach(function(cl){ var x=cl.x-worldX*0.3; if(x>-140&&x<W+40) drawImg(c,SPR.cloud,x,cl.y,cl.w,cl.w*0.6); });
   c.fillStyle='#3FA9F5'; c.fillRect(0,groundY+groundH*0.4,W,H);
   for(var i=0;i<N;i++){ var x=i*tileW-worldX; if(x>W||x<-tileW)continue; drawImg(c, solid[i]?SPR.ground:SPR.water, x, groundY, tileW+1, groundH); }
   palms.forEach(function(p){ var x=p.wx-worldX; if(x>W+90||x<-140)return; drawImg(c,SPR.palm,x-40,groundY-150+6,132,152); });
   plats.forEach(function(p){ var x=p.wx-worldX; if(x>W||x<-p.w)return; drawImg(c,SPR.platform,x,p.y-6,p.w,p.w*0.46); });
   apples.forEach(function(ap){ if(ap.taken)return; var x=ap.wx-worldX; if(x>W+40||x<-40)return; drawImg(c,SPR.apple,x-17,ap.y,34,42); c.fillStyle='#fff'; c.strokeStyle='#2b2a4a'; c.lineWidth=3; c.font='bold 13px Nunito,sans-serif'; c.textAlign='center'; c.textBaseline='top'; c.strokeText(ap.word.en,x,ap.y+44); c.fillText(ap.word.en,x,ap.y+44); });
   crabs.forEach(function(cr){ if(!cr.alive)return; var x=cr.wx-worldX; if(x>W+40||x<-50)return; drawImg(c,SPR.crab,x-26,groundY-30,52,30); });
   var fxx=flagWx-worldX; if(fxx<W+70){ drawImg(c,SPR.flag,fxx-12,groundY-76,66,76); }
   if(!(inv>0 && Math.floor(Date.now()/90)%2)) drawImg(c, onGround?SPR.run:SPR.jump, foxX, foxY, foxW, foxH);
   if(msgT>0){msgT--;c.fillStyle='rgba(0,0,0,.5)';roundRect(c,W/2-104,10,208,30,10);c.fill();c.fillStyle='#fff';c.font='bold 15px Nunito,sans-serif';c.textAlign='center';c.textBaseline='middle';c.fillText(msg,W/2,25);}
   c.fillStyle='rgba(0,0,0,.28)';c.font='bold 13px Nunito,sans-serif';c.textAlign='center';c.textBaseline='alphabetic';c.fillText('tocá para saltar 🦊',W/2,H-10);
   GAME.raf=requestAnimationFrame(loop);
 }
 loop();
}

/* ===== CONFETTI ===== */
var cv=document.getElementById('cf'),cx=cv.getContext('2d'),ps=[];
function csz(){cv.width=innerWidth;cv.height=innerHeight;}csz();addEventListener('resize',csz);
var COLS=['#57C4A6','#FF9C87','#FFD36B','#7FC4F2','#B6A8EE','#FF9FC6'];
function burst(n){for(var i=0;i<n;i++){ps.push({x:innerWidth/2+(Math.random()-.5)*120,y:innerHeight*.4,vx:(Math.random()-.5)*9,vy:-Math.random()*11-4,g:.3+Math.random()*.15,s:6+Math.random()*7,c:COLS[(Math.random()*COLS.length)|0],r:Math.random()*6,vr:(Math.random()-.5)*.4,life:70+Math.random()*40});}}
function cloop(){cx.clearRect(0,0,cv.width,cv.height);for(var i=ps.length-1;i>=0;i--){var p=ps[i];p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;p.life--;if(p.life<=0||p.y>cv.height+30){ps.splice(i,1);continue;}cx.save();cx.translate(p.x,p.y);cx.rotate(p.r);cx.fillStyle=p.c;cx.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);cx.restore();}requestAnimationFrame(cloop);}
cloop();

if(S.name){document.getElementById('nameIn').value=S.name;}
if('serviceWorker' in navigator){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}
</script>
